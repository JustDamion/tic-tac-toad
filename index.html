<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js"></script>
</head>

<body>
    <header class="header">
        <div class="header__branding">
            <h1 class="header__title">Tic-Tac-Toad</h1>
        </div>
        <div class="header__player-info">
            <div class="header__player1">
                <h2 class="player1__name">Player 1</h2>
                <label class="player1__health-label" for="player1-health">50 HP</label>
                <progress class="player1__health" id="player1-health" max="30" value="30"></progress>
            </div>
            <div class="header__player2">
                <h2 class="player2__name">Enemy</h2>
                <progress class="player2__health" id="player2-health" max="50" value="50"></progress>
                <label class="player2__health-label" for="player2-health">50 HP</label>
            </div>
        </div>
    </header>

    <main class="main">
        <section class="champion-section">
            <form class="champion__form" action="">
                <fieldset class="champion-form__fieldset">
                    <legend class="champion-form__legend">CHOOSE YOUR CHAMPION</legend>

                    <div class="champions">
                        <div class="champion">
                            <label class="champion__label" for="champ1">
                                <img class="champion__portrait" src="images/Portrait_Placeholder.png" alt="">
                                <input class="champion__select" type="radio" id="champ1" name="champion" value="champ1"
                                    checked>
                                Danny DaviToad (30 HP)
                            </label>
                        </div>
                        <div class="champion">
                            <label class="champion__label" for="champ2">
                                <img class="champion__portrait" src="images/Portrait_Placeholder.png" alt="">
                                <input class="champion__select" type="radio" id="champ2" name="champion" value="champ2">
                                James Pond (50 HP)
                            </label>
                        </div>
                        <div class="champion">
                            <label class="champion__label" for="champ3">
                                <img class="champion__portrait" src="images/Portrait_Placeholder.png" alt="">
                                <input class="champion__select" type="radio" id="champ3" name="champion" value="champ3">
                                Gerald (100 HP)
                            </label>
                        </div>
                    </div>
                </fieldset>
                <button class="champion-form__button" type="submit">Select Champion</button>
            </form>
        </section>

        <div class="player">
            <h2 class="player__turn"></h2>
        </div>

        <section id="board"></section>
    </main>

    <footer class="footer"></footer>
</body>

</html>
