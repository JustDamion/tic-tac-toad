<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js"></script>
</head>

<body>
    <header class="header">
        <div class="header__branding">
            <h1 class="header__title">Tic-Tac-Toe</h1>
        </div>
    </header>

    <main class="main">
        <section class="champion-section">
            <form class="champion__form" action="">
                <fieldset class="champion-form__fieldset">
                    <legend class="champion-form__legend">CHOOSE YOUR CHAMPION</legend>

                    <div class="champion">
                        <input type="radio" id="champ1" name="champion" value="champ1" checked>
                        <label for="champ1">Champ 30</label>
                    </div>
                    <div class="champion">
                        <input type="radio" id="champ2" name="champion" value="champ2">
                        <label for="champ2">Champ 50</label>
                    </div>
                    <div class="champion">
                        <input type="radio" id="champ3" name="champion" value="champ3">
                        <label for="champ3">Champ 100</label>
                    </div>
                </fieldset>
                <button class="champion-form__button" type="submit">Select Champion</button>
            </form>
        </section>

        <div class="player">
            <h2 class="player__turn"></h2>
        </div>

        <section id="board"></section>
    </main>

    <footer class="footer"></footer>
</body>

</html>
